# The real Ensoniq DOC's volume curve, measured on the user's Apple IIgs (2026-11-15), for the
# NTP build option `doc_volume = "measured"` (src/migs/docvolume.py; docs/es5503.md, "Measured on
# the listening machine"). The DOC's volume isn't linear: about linear in (register - 28) above
# DOC 40, a null near DOC 19-23 and a faint leak below; every emulator we use is linear.
#
# How: `just docsweep` (the test song steps a tone through MOD volumes 64..1 under NinjaTrackerPlus,
# DOC volume = MOD * 1020 // 256), played in SenseiPlay; Audio Animator Line Out -> mixer ->
# GarageBand, 44.1 kHz 24-bit; `doc-sweep-analyse`, levels against a constant pilot tone.
# The recording isn't kept in the repository; this table is the measurement.
#
# level_db[i] = level of MOD volume i+1 in dB relative to MOD volume 64 (MOD 0 is silent).
# One machine, one card, ROM version not recorded.
source = "user's IIgs + Applied Engineering Audio Animator line out, 2026-11-15"
level_db = [
  -47.6, -47.6, -47.7, -48.5, -52.3, -52.4, -38.9, -32.4,
  -28.8, -25.8, -23.7, -21.8, -20.4, -18.9, -17.9, -16.8,

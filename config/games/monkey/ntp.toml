# MI1 -> ProTracker MOD (15CH) -> NinjaTrackerPlus. See docs/ninjatrackerplus.md.
# Instruments/drums come from mt32sounds.toml (this folder) (same MT-32 sounds and merges as MI1.BNK).
#
# Timing: rows sit on each song's detected grid unit (usually a 16th); rows_per_unit
# subdivides it. Each note keeps its micro-timing with EDx (quantize = 0) or is snapped
# toward its row (quantize = 1). Smaller rows = more pattern RAM and player CPU.

[defaults]
samples = "per-song"    # per-song: each .NTP carries only its own sounds, free DOC RAM -> longer
                        # loops (NTPprepare loads samples per song anyway). shared: one set for
                        # every song, like the MIDI Synth bank. Override: just ntpmod shared
rows_per_unit = 2       # 32nd-note rows on a 16th-note grid
speed = 3               # tracker ticks per row; EDx resolution = row / speed
release_rows = "mean"   # a release row plays the release's mean (RMS) gain over the row, not its
                        # first instant ("start", before 2026-11-12): fast releases (organ) no
                        # longer hold full volume for a row (docs/ninjatrackerplus.md, "Staccato")
quantize = 0.0          # 0 = full performance timing, 1 = hard snap to rows
oscillators = 31        # NTP budget: drum (one-shot) tracks use 1, looped melodic tracks 2
attack_bytes = 2040     # loop header; NTP adds 8 stopper bytes -> one 2 KB DOC block
loop_bytes = 512        # short loop: one cycle, tiled (decaying sounds; the minimum)
loop_construction = "eprime"  # short loops. eprime: E'+ (whole samples per cycle, power-averaged
                        # harmonic cycle, exact zero crossing, phase-aligned attack; no 8-bit
                        # loop-rate buzz; docs/sample-construction.md). averaged: the original
                        # averaged cycle (fractional samples per cycle). Long raw loops: same in both.
max_loop_bytes = 16384  # long loops (raw sustain, crossfaded seam) for steady sounds, grown per
                        # song into the DOC RAM that song's own samples leave free
raw_loop_slow_hz = 2.0  # a raw loop size is used only if it repeats at most this often (its
                        # movement then reads as the sound's own wobble: Elec Organ 8192 B at
raw_loop_max_tremolo_db = 1.0  # 1.1 Hz), or is as clean as the averaged loop: cycle levels within
raw_loop_max_buzz_db = -50.0   # this range and loop-rate content below this. Else it adds a tremolo
                        # or buzz (shared Elec Organ 1024 B: 6.3 dB at 15 Hz; Trombone 1024 B: -39 dB)
raw_loop_tune_cents = 1.0  # raw loops take the highest rate tuned within this (0: the closest tuning, which
                        # landed anywhere in the window: Panpipes 16384 B at 14.9 kHz, Elec Organ 8192 B at
                        # 9.2 kHz; the attack shares the rate). Not clean there: the highest that repeats
                        # at most raw_loop_slow_hz
raw_loop_max_rate_drop = 0.1  # a raw loop's rate at most this far below the short loop's (Sax 8192 B at
                        # 16.3 kHz scored 1.4 dB worse than 512 B at 18.9 kHz; Elec Organ's 8192 B wobble
                        # loop at 15.7 kHz is 6 % below)
sub_octave_min_share = 0.02  # a loop cycle spans two note periods when the sustain has at least this
                        # share of its power an octave below the note (Pipe Org 2: 8-19 % at every
                        # key; a one-period loop dropped it and sounded an octave above its attack)
reserve_pages = 16      # DOC pages kept free for game sound effects (4 KB)
sustain_s = 0.4         # where the loop's cycles are taken (s after onset): the steady sustain,
                        # not the attack's end (organs build their fundamental after ~0.12 s)
min_rate = 9000         # sample-rate window for melodic samples (Hz)
max_rate = 22000
release_max = 0.3       # seconds of release ramp after note-off
pitch_plan = true       # choose each sound's sampled key(s), key zones and short-loop rate from
                        # the notes its songs play (pitchplan, measured with docsim against Munt;
                        # default since 2026-11-09). false: mt32sounds.toml's fixed key
pitch_move_gain_db = 0.5  # a single sample moves off the configured key only if this lowers the error
                        # (the measure covers the first 0.6 s, not the loop the move changes)
pitch_zones = "hybrid"  # what each played key counts for. hybrid (default since 2026-11-09): half an
                        # equal share per played key, half by note seconds (pitch_key_share); unplayed
                        # keys never count. weighted: note seconds only (samples gather where notes
                        # are held longest: MI153 key 52 from a sample at 74)
pitch_key_share = 0.5
sample_budget = "value" # value (default since 2026-11-09): extra zones and bigger drum blocks compete
                        # for DOC pages by dB x exposure per page, down to upgrade_min_db_per_page; the
                        # rest grows loops. zones: extra zones while each gains pitch_zone_gain_db
upgrade_min_db_per_page = 0.011  # (0.01 cost MI160 its Elec Organ 16 KB loop for a 3rd Acou Bass zone)
drum_fill_block = true  # a drum takes the highest rate that still fits its block (seven drums sat at
                        # 5872 Hz in half-empty blocks: docs/ninjatrackerplus.md "Hybrid key weights")
pitch_max_zones = 3     # samples (key zones) one sound may get, each an attack + loop and a MOD slot
pitch_zone_gain_db = 1.0  # sample_budget = "zones" only: an extra zone must lower its sound's mean
                        # error by this much; zones take DOC RAM before loop growth
env_max_rise_db = 1.5   # a held note's per-row Cxx rises at most this much (at least one step);
                        # the DOC applies volume instantly, so beating contours (French Horn) pumped
                        # in jumps. Falls are not limited (real decays). 0 = off. docs/ninjatrackerplus.md
                        # "Smoother sustains" step 5
drum_borrow = "last"    # drums use an idle melodic track when no drum track is free and the budget
                        # is full ("first": before opening a new drum track; "never")
steal_protect = 2        # steals prefer parts (channels) with more notes active than this: spare
                        # bass lines and solos/duets, take a chord voice (0: quietest release only)
melodic_one_shots = "any"  # one-shots (Xylophone) may use 1- or 2-oscillator tracks ("melodic": 2 only)
delay_snap_db = 4.0     # a delayed (EDx) note whose start at the sample's default volume would be
                        # more than this off moves one tick to the nearest row, velocity in-cell
                        # (never onto a same-part neighbour: flams, rolls). Remove to keep all delays
delay_snap_ms = 20      # also move a delayed note onto its nearest row when its onset is within this
                        # many ms of it and its velocity isn't the default: no EDx, velocity in-cell.
                        # 0 = off. Default-volume notes sat 15-43 ms from a row (10-90 %, per-song;
                        # a tick is a third of a row, 18-51 ms). Default since 2026-11-11 (by ear: 20 over 30)
track_plan = true       # choose each song's 2-/1-oscillator track split for the least polyphony loss
                        # (plan_tracks) instead of letting the first notes fix it
halt_released_loops = true  # end each release with a silent looped rest that replaces the loop: NTP
                        # applies a delayed (EDx) cell's instrument volume at tick 0, which made
                        # the old loop audible until the note (docs/ninjatrackerplus.md "Ghosts")
halt_before_delayed = true  # also halt a 2-oscillator track that is still sounding (a release not
                        # yet at 0, a note cut for this one) on the row before a delayed note; with
                        # no free row there, put the note on the nearest row. MI160 on the IIGS:
                        # 336 tick-0 jumps -> 2 (on by default since 2026-11-11, after listening)
one_shots = true        # decaying sounds that reach the 8-bit floor (`one_shot_floor_lsb` RMS in
one_shot_floor_lsb = 1.5  # a peak-normalised sample) within the DOC RAM their attack + loop would
one_shot_max_rate_drop = 0.1  # take become one-shots (1 oscillator, exact tuning), at most 10 %
                        # below the looped rate. docs/sample-construction.md "One-shots"
drum_min_rate = 6000    # one-shot rate window (Hz); within it the rate follows each drum's
drum_max_rate = 26000   # bandwidth, trading length for it (hats, shakers need ~26 kHz)
drum_floor_lsb = 1.5    # drums end at the 8-bit floor (drum_end: junk near the floor after
                        # the decay is cut too); 0 = the old -46 dB length

# Per-mode overrides of [defaults].
# Shared set (every sound for every song): shorten these sounds' attacks to 1016 B so the set
# fits below the 16-page sound-effect reserve. A decision, checked by the build (ntpmod
# check_fit): it fails, naming the pages missing, when the cuts aren't enough, and logs a cut
# the set no longer needs to fit (2026-11-11: none of the four; the 16 pages they free go to
# zones, loops and drums, so undoing them is a sound change: a trial). Chosen 2026-11 as the attacks that shorten at the least measured
# cost (log-spectral distance vs Munt, first 0.6 s: Elec Organ -0.28 dB, Sax -0.10, Acou Bass
# +0.04, Vibes +0.06), when the set needed 254 of 256 pages at its smallest.
[modes.shared]
ntp_attack_bytes = { "Elec Organ" = 1016, "Sax" = 1016, "Acou Bass" = 1016, "Vibes" = 1016 }

# The two builds (justfile `ntp_modes`): build/<game>/ntp/<name>/ and /songs/<NAME> on the disks
# (INST.PER.SONG, INST.SHARED). Each is its sample-set mode with nothing overridden.
[modes.inst-per-song]
base = "per-song"
[modes.inst-shared]
base = "shared"

# Trial variants, built side by side for listening: a `base` sample-set mode plus overrides.
# Add the name to `ntp_variants` in the game's game.toml. E.g. the original loops next to `shared`:
# [modes.shared-avg]
# base = "shared"
# loop_construction = "averaged"
# or the planner before the hybrid default (note-time weights, zones by gain, drums by bandwidth):
# [modes.per-song-weighted]
# base = "per-song"
# pitch_zones = "weighted"
# sample_budget = "zones"
# drum_fill_block = false
# or the configured keys without the pitch plan:
# [modes.per-song-fixed]
# base = "per-song"
# pitch_plan = false

# Trial (2026-11-12): no merges. Every MT-32 program and rhythm key the songs play gets its own
# sample, instead of the one mt32sounds.toml's `covers` share for the 16-slot MIDI Synth bank
# (e.g. MI165's Syn Brass4 chords on Trombone 2's sample: 5-7 dB more at 2-4 kHz; its Elec
# Bass1 on Acou Bass2's: 15-30 dB less at 1-4 kHz). Per-song only: the shared set's 31 MOD
# slots are full.
[modes.no-merges]
base = "per-song"
merges = false

# Trials (2026-11-13): docsim 2.0 (src/migs/docsim2.py; plans/docsim2.md), cumulative.
# ds2-loops: raw loops grow by measured value per DOC page (every raw size a steady sound
# allows is built as it would ship and scored against Munt, notes held 3 s), not by usage.
# Revised 2026-11-13 after listening (docs/ninjatrackerplus.md, "docsim 2.0 trials"): the live
# term, time alone in the mix counted extra, and loops valued only past the attack.
[modes.ds2-loops]
base = "per-song"
loop_budget = "docsim2"
docsim2_mod_weight = 1.0     # per-band movement; with live 0.2, all 8 listening verdicts hold (by >= 1.6 dB)
docsim2_live_weight = 0.2    # how alive the whole sound is (depth as a ratio): MI153 organ 512 B loops sound flat
alone_weight = 2.0           # time with k other parts counts 1 + 2/(1+k): little else in the mix (MI160, MI153)
loop_time_after_attack = true   # a loop is valued by note time after the attack; staccato notes never reach it
loop_exposure_cap_s = 20.0   # a loop counts long sustains in full (a short loop's sameness grows): MI160 opens on 20.6 s
# ds2-pitch: ds2-loops, plus the pitch plan, zones and drum sizes priced with docsim2 over the
# whole held note (docsim's first 0.6 s missed MI165's harsh sustain). Its scores are on
# docsim2's scale (20 log10 of the loudness distance); the gain thresholds are unchanged.
# Exposure counts each note up to 3 s, the window docsim2 hears, and loops trade pages with
# zones and drums on that one scale (a loop may take back a drum upgrade worth less per page).
[modes.ds2-pitch]
base = "per-song"
loop_budget = "docsim2"
pitch_measure = "docsim2"
exposure_cap_s = 3.0
docsim2_mod_weight = 1.0     # per-band movement; with live 0.2, all 8 listening verdicts hold (by >= 1.6 dB)
docsim2_live_weight = 0.2    # how alive the whole sound is (depth as a ratio): MI153 organ 512 B loops sound flat
alone_weight = 2.0           # time with k other parts counts 1 + 2/(1+k): little else in the mix (MI160, MI153)
loop_time_after_attack = true   # a loop is valued by note time after the attack; staccato notes never reach it
loop_exposure_cap_s = 20.0   # a loop counts long sustains in full (a short loop's sameness grows): MI160 opens on 20.6 s
drum_value_weight = 0.5      # a drum's dB at half a melodic one's: starved toms went unheard in the mix
loops_take_zones = true      # a loop may take back zones and priced-merge own samples worth less per page
zone_value_weight = 0.5      # an extra zone's dB at half a loop's: moved zones unheard (MI163/167), MI160 organ loop wanted
# ds2-merges: ds2-pitch, plus merges priced per song: a program (rhythm key) shares a merged
# sound's sample only when its notes score at most merge_max_cost_db (docsim2 dB) worse from it
# than from their own sample. The bake-off put the line between Fretless 2 (0.08 of a train
# wreck: fine) and Syn Brass4 (0.20: heard as harsh), about 1 dB.
[modes.ds2-merges]
base = "per-song"
loop_budget = "docsim2"
pitch_measure = "docsim2"
exposure_cap_s = 3.0
docsim2_mod_weight = 1.0     # per-band movement; with live 0.2, all 8 listening verdicts hold (by >= 1.6 dB)
docsim2_live_weight = 0.2    # how alive the whole sound is (depth as a ratio): MI153 organ 512 B loops sound flat
alone_weight = 2.0           # time with k other parts counts 1 + 2/(1+k): little else in the mix (MI160, MI153)
loop_time_after_attack = true   # a loop is valued by note time after the attack; staccato notes never reach it
loop_exposure_cap_s = 20.0   # a loop counts long sustains in full (a short loop's sameness grows): MI160 opens on 20.6 s
drum_value_weight = 0.5      # a drum's dB at half a melodic one's: starved toms went unheard in the mix
loops_take_zones = true      # a loop may take back zones and priced-merge own samples worth less per page
zone_value_weight = 0.5      # an extra zone's dB at half a loop's: moved zones unheard (MI163/167), MI160 organ loop wanted
merges = "priced"
merge_max_cost_db = 1.0

# Per-song overrides, e.g.:
# [songs.160]
# rows_per_unit = 1
# unit_ticks = 40.6     # override the detected grid unit (the song's MIDI ticks: 120 per beat)
# phase_ticks = 12.0

# NTP-only sounds: split out of the shared bank's merges (mt32sounds.toml). `slot` only
# needs to be unique; it isn't a MIDI Synth slot.
# Optional: `keys = [lo, hi]` limits a sound to a key range (key splits: the MT-32 voices some
# timbres differently by register; keys outside every range use the nearest one);
# `ntp_attack_bytes` overrides the loop-header length; `modes` limits the sound to some
# sample-set modes or build variants (default: all).
[[melodic]]
slot = 101
name = "Pipe Organ"
program = 13
covers = [13]             # MI153. Elec Org 2's sample has a deep rotary wobble Pipe Org 2 lacks
key = 60
keys = [52, 127]
ntp_attack_bytes = 1016   # organs speak in ~50 ms; 1016 + 8 stopper bytes = one 1 KB block
[[melodic]]
slot = 102
name = "Pipe Organ Lo"
program = 13
covers = [13]             # MT-32 Pipe Org 2 below key 52 is mostly 2nd-4th harmonic (fundamental
key = 44                  # 2-5%); key 60's sample transposed down is 50% fundamental at 65-98 Hz
keys = [40, 51]
ntp_attack_bytes = 1016
[[melodic]]
slot = 103
name = "Pipe Organ Lo2"
program = 13
covers = [13]             # keys 36-39: 3rd-harmonic heavy on the MT-32
key = 37
keys = [0, 39]
ntp_attack_bytes = 1016
modes = ["per-song"]      # no room in the shared set; keys 36-39 use Pipe Organ Lo there

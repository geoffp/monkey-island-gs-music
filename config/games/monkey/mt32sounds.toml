attack_bytes = 4096       # a drum: mostly attack

# Drum kits: slots 0 and 9 (MIDI Synth allows 8 key zones per instrument), grouped by sample
# length: a kit's envelope frees the voice after its longest sample, so short sounds (slot 0)
# don't hold voices as long as kick/snare/toms (slot 9).
[[drum]]
slot = 9
name = "Kick"
key = 36
covers = [35, 36]
bytes = 2048

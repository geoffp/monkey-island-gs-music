# The MT-32 sounds we sample through Munt, and which MT-32 programs / rhythm keys each covers.
# Read by the NinjaTrackerPlus build (ntpmod / ntpsamples, with ntp.toml's NTP-only
# settings), the loop lab, and the MIDI Synth MI1 bank (src/migs/mt32bank.py, `just mt32bank`).
#
# MI1 bank settings: one shared bank (16 slots, 64 KB DOC RAM) loaded once for every song.
# Melodic slot = attack sample (one-shot, `attack_bytes`) + one sustain cycle looped (256 B),
# with MIDI Synth's envelope fitted to the MT-32's. Drum zone = one-shot sample of `bytes`.
# `covers` lists the MT-32 programs / rhythm keys that play this sound (merges). Drum keys
# that share a sample are pitched by their measured offset from the sampled key.

bank = "MI1"
reserve_pages = 16        # DOC pages kept free at the top for game sound effects (4 KB)
hold_seconds = 2.0        # sampled note length (melodic)

[[melodic]]
slot = 1
name = "Acou Bass"
program = 65
covers = [65, 66, 71]     # Acou Bass2, Elec Bass1, Fretless 2
key = 36
[[melodic]]
slot = 2
name = "Elec Organ"
program = 9
covers = [9, 13]          # Elec Org 2, Pipe Org 2
key = 60
[[melodic]]
slot = 3
name = "Marimba"
program = 104
covers = [104]
key = 60

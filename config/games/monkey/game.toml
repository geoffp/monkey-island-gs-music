# The Secret of Monkey Island, DOS VGA floppy release. The folder name (`monkey`) is the game
# id, ScummVM's own (ref/scummvm/engines/scumm/detection_tables.h), and names the game's build
# output: build/monkey/. Read by migs.games (and, for the justfile, tools/game.py: keep the
# top-level values plain strings). Facts about this game's data: docs/games/monkey.md.

name = "The Secret of Monkey Island"
release = "DOS VGA floppy"
engine = "scumm-v4"              # SCUMM v4 container, MT-32 music in RO blocks (docs/ro-format.md)
data = "The Secret of Monkey Island (Floppy DOS VGA)"   # folder under original files/
prefix = "MI"                    # song files (MI150.mod, MI150.SEQ) and disk volumes (MI.NTP)
label = "MI1"                    # titles: song "MI1 150", MIDI "MI1 sound 150", emulator configs
ntp_variants = "inst-per-song inst-shared no-merges ds2-loops"   # trials (ntp.toml)

# The release this config was tuned on (ScummVM scumm-md5.h: monkey, VGA, English, DOS).
# `extract` warns when the data differs.
[md5]
"000.LFL" = "15e03ffbfeddb9c2aebc13dcb2a4a8f4"
"DISK04.LEC" = "8de9e90998a81c3c2b5aabd11d20aa87"

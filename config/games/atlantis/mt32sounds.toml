# How to sample the MT-32 sounds Fate of Atlantis's songs play, through Munt (see Monkey
# Island 1's mt32sounds.toml for what entries can say). No entries yet (2026-11-11): every
# program, custom timbre (ids from 128: build/atlantis/extracted/timbres.toml) and rhythm key
# the songs play gets a default sound (src/migs/sounds.py), and the build log lists them.
# Add entries here to merge sounds, choose sampled keys or sizes.

bank = "FOA"

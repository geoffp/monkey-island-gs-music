[project]
name = "migs"
version = "0.1.0"
description = "Extract SCUMM games' MT-32 soundtracks (first: Monkey Island 1) and port them to the Apple IIGS as NinjaTrackerPlus songs"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"   # tomllib
dependencies = [
    "mido>=1.3",
    "numpy>=2.4.6",
    "scipy>=1.17.1",
]

[project.scripts]
disk-readme = "migs.diskreadme:main"
extract-music = "migs.extract_music:main"
mid2seq = "migs.mid2seq:main"
midisynth-audition = "migs.midisynth_audition:main"
gs2-config = "migs.gs2config:main"
midisynth-tunetest = "migs.midisynth_tunetest:main"
gs2-docscope = "migs.gs2client:main"
mt32bank = "migs.mt32bank:main"
midisynth-voices = "migs.midisynth_voices:main"
ntpmod = "migs.ntpmod:main"
ntpcheck = "migs.ntpfile:main"
looplab = "migs.looplab:main"

[dependency-groups]
dev = ["pytest>=8"]
lab = [
    "matplotlib>=3.11.2",
]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

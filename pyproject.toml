[project]
name = "migs"
version = "0.1.0"
description = "Extract the Monkey Island 1 MT-32 soundtrack and port it to Apple IIGS MIDI Synth"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"   # tomllib
dependencies = [
    "mido>=1.3",
]

[project.scripts]
extract-music = "migs.extract_music:main"
mid2seq = "migs.mid2seq:main"
audition = "migs.audition:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.9,<0.14"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

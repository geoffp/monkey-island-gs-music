# SPDX-License-Identifier: GPL-3.0-or-later
# Fresh-machine checks without the game data (it can't be in CI): every download and its pin,
# the Munt build, the unit tests (including PHP running Ninjaforce's converter) and a smoke test
# of the fetched tools, on Linux (the base) and macOS (a goal).
# The weekly run catches downloads that moved or changed before someone else hits them.
name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"          # Mondays 06:17 UTC

jobs:
  unix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45             # a whole run takes ~4 min; don't sit out GitHub's 6 h limit
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - uses: extractions/setup-just@v4
      # A stalled package mirror hung this step for 16+ minutes on 2026-11-11 (normally < 1):
      # fail it after 10 and let apt retry slow downloads instead of waiting forever.
      # --no-install-recommends: without it, ffmpeg and fluidsynth pull in ~160 packages
      # (264 MB: Qt 6, Qsynth, speech recognition, video drivers) that nothing here uses.
      - name: Host tools (Ubuntu)
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: |
          apt="-o Acquire::Retries=3 -o Acquire::http::Timeout=30"
          sudo apt-get $apt update
          sudo apt-get $apt install -y --no-install-recommends cmake g++ pkg-config libglib2.0-dev php-cli ffmpeg fluidsynth unzip
      - name: Host tools (macOS)
        if: runner.os == 'macOS'
        timeout-minutes: 15
        run: brew install cmake pkg-config glib php ffmpeg fluid-synth
      - run: just doctor
      - run: just setup
      - run: just test -rs                # -rs: list why tests skipped
      - run: just smoke
